<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="converter-card">
        <h1>Temperature Converter</h1>

        <div id="errorBox" class="error-msg"></div>

        <div class="form-group">
            <label for="tempInput">Temperature Value:</label>
            <input type="number" id="tempInput" placeholder="Enter number..." step="any">
        </div>

        <div class="form-group">
            <label for="unitSelect">Select Input Unit:</label>
            <select id="unitSelect">
                <option value="celsius">Celsius (°C)</option>
                <option value="fahrenheit">Fahrenheit (°F)</option>
                <option value="kelvin">Kelvin (K)</option>
            </select>
        </div>

        <button id="convertBtn">Convert</button>

        <div class="results-container">
            <div class="result-box">
                <span class="result-label">Celsius:</span>
                <span id="celsiusVal" class="result-value">-- °C</span>
            </div>
            <div class="result-box">
                <span class="result-label">Fahrenheit:</span>
                <span id="fahrenheitVal" class="result-value">-- °F</span>
            </div>
            <div class="result-box">
                <span class="result-label">Kelvin:</span>
                <span id="kelvinVal" class="result-value">-- K</span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
